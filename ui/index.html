<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Agile Writer | Test Runner</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
  <link rel="icon" href="automation.png">
</head>
<body>

<div class="container">
  <div class="card">
    <div class="header">
      <h1>Agile Writer | Test Runner</h1>
      <p>Configure and trigger automated validations</p>
    </div>

    <div class="grid">
      <div class="form-group">
        <label for="tester">Tester Name</label>
        <input id="tester" type="text" placeholder="John Doe" />
      </div>
      <div class="form-group">
        <label for="testFile">Test Script</label>
        <select id="testFile">
          <option value="AW_00_10_consolidated_flow.spec.ts">AW_00_10_consolidated_flow.spec.ts</option>
        </select>
      </div>
    </div>

    <div class="grid">
      <div class="form-group">
        <label for="email">Microsoft Email</label>
        <input id="email" type="email" placeholder="email@synterex.com" />
      </div>
      <div class="form-group">
        <label for="password">Password</label>
        <input id="password" type="password" placeholder="••••••••" />
      </div>
    </div>
    <div class="form-group">
        <label for="folder">Folder Name</label>
        <input id="folder" type="text" placeholder="QA Testing" />
      </div>
    <div class="form-group">
      <label for="template">Template Name</label>
      <input id="template" type="text" placeholder="Destination_Template.docx" />
    </div>

    <div class="form-group" id="source-files-container">
      <label>Source File(s)</label>
      <div class="source-input-group">
        <input type="text" class="source-input" placeholder="Source_Protocol.docx" />
        <button type="button" class="btn-icon" onclick="addSourceInput()">+</button>
      </div>
    </div>

    <div class="actions">
      <button class="btn-primary" id="runBtn" onclick="runTest()">Start Automation Run</button>
      <button class="btn-secondary" onclick="downloadReport()">Download Last Report</button>
    </div>

    <!-- Live Execution Tracking -->
    <div id="execution-stats" style="display: none; justify-content: space-between; margin-top: 1.5rem; color: var(--text-muted); font-size: 0.875rem; font-weight: 500;">
      <span>Status: <span id="run-status" style="color: var(--primary);">Initializing...</span></span>
      <span id="timer" style="font-family: monospace; background: rgba(0,0,0,0.2); padding: 2px 6px; border-radius: 4px;">00:00</span>
    </div>
    <div id="log-terminal" class="log-terminal" style="display: none;"></div>

    <p id="status"></p>
  </div>
</div>

<script src="script.js"></script>

</body>
</html>
