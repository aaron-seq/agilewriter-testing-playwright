<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Agile Writer | Test Runner</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --primary: #6366f1;
      --primary-hover: #4f46e5;
      --bg: #0f172a;
      --card-bg: rgba(30, 41, 59, 0.7);
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --border: rgba(255, 255, 255, 0.1);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Outfit', sans-serif;
      background-color: var(--bg);
      background-image: 
        radial-gradient(at 0% 0%, rgba(99, 102, 241, 0.15) 0, transparent 50%), 
        radial-gradient(at 100% 100%, rgba(168, 85, 247, 0.15) 0, transparent 50%);
      color: var(--text);
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      overflow-x: hidden;
    }

    .container {
      width: 100%;
      max-width: 500px;
      padding: 2rem;
    }

    .card {
      background: var(--card-bg);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid var(--border);
      border-radius: 24px;
      padding: 2.5rem;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
      animation: fadeIn 0.6s ease-out;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .header {
      text-align: center;
      margin-bottom: 2rem;
    }

    .header h1 {
      font-size: 1.875rem;
      font-weight: 600;
      letter-spacing: -0.025em;
      margin-bottom: 0.5rem;
      background: linear-gradient(to right, #818cf8, #c084fc);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .header p {
      color: var(--text-muted);
      font-size: 0.875rem;
    }

    .form-group {
      margin-bottom: 1.25rem;
    }

    label {
      display: block;
      font-size: 0.75rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      margin-bottom: 0.5rem;
      color: var(--text-muted);
    }

    input, select {
      width: 100%;
      background: rgba(15, 23, 42, 0.5);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 0.75rem 1rem;
      color: var(--text);
      font-family: inherit;
      font-size: 0.9375rem;
      transition: all 0.2s;
      appearance: none;
    }

    select {
      background-image: url("data:image/svg+xml;charset=US-ASCII,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20width%3D%22292.4%22%20height%3D%22292.4%22%3E%3Cpath%20fill%3D%22%2394a3b8%22%20d%3D%22M287%2069.4a17.6%2017.6%200%200%200-13-5.4H18.4c-5%200-9.3%201.8-12.9%205.4A17.6%2017.6%200%200%200%200%2082.2c0%205%201.8%209.3%205.4%2012.9l128%20127.9c3.6%203.6%207.8%205.4%2012.8%205.4s9.2-1.8%2012.8-5.4L287%2095c3.5-3.5%205.4-7.8%205.4-12.8%200-5-1.9-9.2-5.5-12.8z%22%2F%3E%3C%2Fsvg%3E");
      background-repeat: no-repeat;
      background-position: right 1rem top 50%;
      background-size: 0.65rem auto;
      cursor: pointer;
    }

    input:focus, select:focus {
      outline: none;
      border-color: var(--primary);
      box-shadow: 0 0 0 4px rgba(99, 102, 241, 0.1);
    }

    .grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 1rem;
    }

    .actions {
      margin-top: 2rem;
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
    }

    button {
      width: 100%;
      padding: 0.875rem;
      border-radius: 12px;
      font-weight: 600;
      font-size: 0.9375rem;
      cursor: pointer;
      transition: all 0.2s;
      border: none;
      font-family: inherit;
    }

    .btn-primary {
      background: var(--primary);
      color: white;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
    }

    .btn-primary:hover {
      background: var(--primary-hover);
      transform: translateY(-1px);
    }

    .btn-primary:active {
      transform: translateY(0);
    }

    .btn-secondary {
      background: rgba(255, 255, 255, 0.05);
      color: var(--text);
      border: 1px solid var(--border);
    }

    .btn-secondary:hover {
      background: rgba(255, 255, 255, 0.1);
    }

    #status {
      margin-top: 1.5rem;
      text-align: center;
      font-size: 0.875rem;
      min-height: 1.25rem;
      color: var(--primary);
      font-weight: 500;
    }

    .loader {
      display: inline-block;
      width: 12px;
      height: 12px;
      border: 2px solid rgba(255, 255, 255, 0.3);
      border-radius: 50%;
      border-top-color: #fff;
      animation: spin 1s ease-in-out infinite;
      margin-right: 8px;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>

<div class="container">
  <div class="card">
    <div class="header">
      <h1>Agile Writer | Test Runner</h1>
      <p>Configure and trigger automated validations</p>
    </div>

    <div class="grid">
      <div class="form-group">
        <label for="tester">Tester Name</label>
        <input id="tester" type="text" placeholder="John Doe" />
      </div>
      <div class="form-group">
        <label for="testFile">Test Script</label>
        <select id="testFile">
          <option value="AW_00_10_consolidated_flow.spec.ts">AW_00_10_consolidated_flow.spec.ts</option>
        </select>
      </div>
    </div>

    <div class="grid">
      <div class="form-group">
        <label for="email">Microsoft Email</label>
        <input id="email" type="email" placeholder="email@synterex.com" />
      </div>
      <div class="form-group">
        <label for="password">Password</label>
        <input id="password" type="password" placeholder="••••••••" />
      </div>
    </div>
    <div class="form-group">
        <label for="folder">Folder Name</label>
        <input id="folder" type="text" placeholder="QA Testing" />
      </div>
    <div class="form-group">
      <label for="template">Template Name</label>
      <input id="template" type="text" placeholder="Destination_Template.docx" />
    </div>

    <div class="grid">
      <div class="form-group">
        <label for="source">Source File(s)</label>
        <input id="source" type="text" placeholder="Source_Protocol.docx" />
      </div>
    </div>

    <div class="actions">
      <button class="btn-primary" id="runBtn" onclick="runTest()">Start Automation Run</button>
      <button class="btn-secondary" onclick="downloadReport()">Download Last Report</button>
    </div>

    <p id="status"></p>
  </div>
</div>

<script>
document.addEventListener('DOMContentLoaded', async () => {
  const testSelect = document.getElementById('testFile');
  try {
    const res = await fetch('http://localhost:3000/list-tests');
    if (res.ok) {
      const tests = await res.json();
      if (tests && tests.length > 0) {
        testSelect.innerHTML = ''; // Clear default
        tests.forEach(testFile => {
          const option = document.createElement('option');
          option.value = testFile;
          option.textContent = testFile;
          testSelect.appendChild(option);
        });
      }
    }
  } catch (error) {
    console.error('Could not load test list:', error);
  }
});

async function runTest() {
  const statusEl = document.getElementById('status');
  const runBtn = document.getElementById('runBtn');
  
  statusEl.innerHTML = '<span class="loader"></span> Tests are currently running...';
  runBtn.disabled = true;
  runBtn.style.opacity = '0.5';

  const data = {
    testerName: document.getElementById('tester').value,
    email: document.getElementById('email').value,
    password: document.getElementById('password').value,
    template: document.getElementById('template').value,
    source: document.getElementById('source').value,
    folder: document.getElementById('folder').value,
    testFile: document.getElementById('testFile').value,
    baseUrl: 'https://app-v2-rc1-aw.smarter.codes',
    appUrl: 'https://app-v2-rc1-aw.smarter.codes/signin',
    envName: 'QA'
  };

  try {
    const response = await fetch('http://localhost:3000/run-test', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(data)
    });

    if (response.ok) {
      statusEl.innerText = '✔ Test Cycle Completed Successfully';
    } else {
      statusEl.innerText = '✖️ Test Execution Failed';
    }
  } catch (error) {
    statusEl.innerText = '✖️ Connection Error: Backend server unreachable';
  } finally {
    runBtn.disabled = false;
    runBtn.style.opacity = '1';
  }
}

function downloadReport() {
  window.open('http://localhost:3000/download-report');
}
</script>

</body>
</html>
