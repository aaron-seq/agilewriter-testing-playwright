# SCC-464 NGINX production reverse proxy baseline.
#
# Infrastructure owners must replace server_name and certificate paths before
# production use. deploy.sh validates that this file exists and contains the
# expected HTTPS reverse proxy contract.

server {
    listen 80;
    server_name _;

    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name _;

    ssl_certificate /etc/letsencrypt/live/agilewriter/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/agilewriter/privkey.pem;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
